
name: FinOps CI

# main 브랜치에 Push하거나 PR을 생성하면 실행
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # GitHub 테스트 환경에서 사용할 변수
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ci_test_password
      DB_NAME: finops_test_db
      VIEWER_API_KEY: ci_viewer_key
      ADMIN_API_KEY: ci_admin_key

    # CI 전용 MySQL 컨테이너
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: finops_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 테스트 DB 초기화
      - name: Initialize test database
        run: python scripts/init_test_db.py

      # 5. 전체 테스트 실행
      - name: Run pytest
        run: python -m pytest tests/ -q
